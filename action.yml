name: Release Wave
description: 'Dispatch production releases across repos and open main-to-epic sync PRs'

inputs:
  rc_version:
    description: 'The release version, in vX.Y.Z format (e.g. v1.2.5)'
    required: true
  use_case:
    description: 'What to run: Production-Release or Main-To-Epic-Sync'
    required: true
  owner:
    description: 'The owner of the repository'
    required: true
    default: 'owner'
  production_branch:
    description: 'The default branch'
    required: true
    default: 'main'
  github_token:
    description: 'The GitHub token'
    required: false
  app_id:
    description: 'The GitHub App ID'
    required: false
  private_key:
    description: 'The GitHub App private key'
    required: false
  installation_id:
    description: 'The GitHub App installation ID'
    required: false
  exclude_repositories:
    description: 'A list of repositories to exclude'
    required: false
  include_repositories:
    description: 'A list of repositories to include'
    required: false
  environment:
    description: 'The environment'
    required: false
  hydra_webhook_url:
    description: 'The URL for the Hydra webhook'
    required: false
  hydra_webhook_secret:
    description: 'The secret for the Hydra webhook'
    required: false
  
outputs:
  slack_payload:
    description: 'The Slack payload'
  sync_pr_slack_payload:
    description: 'The Slack payload for Main to Epic Sync'

runs:
  using: docker
  image: Dockerfile